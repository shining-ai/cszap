<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>エアホッケー</title>
  <style>
    body {
      background: #222;
      color: #eee;
      text-align: center;
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      box-sizing: border-box;
    }

    .game-container {
      width: 100vw;
      height: 100vh;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 0;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    canvas {
      background: #111;
      display: block;
      margin: 0;
      border: 2px solid #555;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      aspect-ratio: unset;
      object-fit: fill;
      box-sizing: border-box;
    }

    #scoreboard {
      font-size: 20px;
      margin: 10px 0;
    }

    .flash {
      animation: flash 0.4s ease;
    }

    @keyframes flash {
      0% {
        background-color: rgba(255, 255, 255, 0.5);
      }

      100% {
        background-color: transparent;
      }
    }

    .debug-info {
      font-size: 0.9em;
      opacity: 0.7;
      margin-top: 10px;
    }

    .debug-info p {
      margin: 5px 0;
    }

    h1 {
      margin: 10px 0;
      font-size: calc(1.5rem + 1vmin);
    }

    @media (max-height: 600px) {
      h1 {
        font-size: 1.2rem;
        margin: 5px 0;
      }

      .debug-info {
        display: none;
      }

      #scoreboard {
        margin: 5px 0;
        font-size: 16px;
      }
    }
  </style>
</head>

<body>
  <h1>エアホッケー</h1>

  <div class="game-container">
    <div id="scoreboard">
      🔵 <span id="scoreTop">0</span> - <span id="scoreBottom">0</span> 🔴
    </div>

    <div id="winner" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); 
         background: rgba(0,0,0,0.8); color: #fff; padding: 20px; border-radius: 10px; font-size: 24px; z-index: 100;">
    </div>

    <div id="team-select" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
         background: rgba(0,0,0,0.9); color: #fff; padding: 30px; border-radius: 15px; text-align: center; z-index: 200;">
      <h2 style="margin: 0 0 20px 0;">チームを選択</h2>
      <button id="blue-team" style="background: #3bb0ff; color: white; border: none; padding: 15px 30px; margin: 0 10px; 
              border-radius: 8px; cursor: pointer; font-size: 18px;">青チーム</button>
      <button id="red-team" style="background: #ff4444; color: white; border: none; padding: 15px 30px; margin: 0 10px;
              border-radius: 8px; cursor: pointer; font-size: 18px;">赤チーム</button>
      <p style="margin: 20px 0 0 0; font-size: 14px; opacity: 0.7;">※ 選択するまでは観戦モードです</p>
    </div>

    <canvas id="game" width="600" height="1000"></canvas>

    <div class="debug-info">
      <p>自分の座標: <span id="mycoords">未送信</span></p>
      <p>パックの座標: <span id="puckcoords">未受信</span></p>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    // ---- 接続設定 ----
    // const socket = io("http://localhost:3000");
    const socket = io("http://57.180.14.18:3000");

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // チーム選択の状態管理
    let selectedTeam = null;
    let isSpectator = true;

    // チーム参加の結果を受信
    socket.on("teamJoined", (data) => {
        selectedTeam = data.team;
        isSpectator = false;
    });

    socket.on("teamError", (data) => {
        alert(data.message);
        document.getElementById("team-select").style.display = "block";
    });
    const myCoordsEl = document.getElementById("mycoords");
    const puckCoordsEl = document.getElementById("puckcoords");
    const scoreTopEl = document.getElementById("scoreTop");
    const scoreBottomEl = document.getElementById("scoreBottom");

    // 基準となるゲームサイズ
    const BASE_WIDTH = 600;
    const BASE_HEIGHT = 1000;
    const WALL_THICKNESS = 16;
    let scale = 1; // CSSスケール（描画には使わない）

    // キャンバスのリサイズ処理
    function resizeCanvas() {
      // プレイ領域＋壁厚み分
      const GAME_WIDTH = BASE_WIDTH + WALL_THICKNESS * 2;
      const GAME_HEIGHT = BASE_HEIGHT + WALL_THICKNESS * 2;
      // ヘッダーやスコアボード等の高さを考慮
      const header = document.querySelector('h1');
      const scoreboard = document.getElementById('scoreboard');
      const debug = document.querySelector('.debug-info');
      let headerH = header ? header.offsetHeight : 0;
      let scoreH = scoreboard ? scoreboard.offsetHeight : 0;
      let debugH = debug ? debug.offsetHeight : 0;
      // 追加の余白
      const margin = 8;
      // 利用可能な高さ
      const availableHeight = window.innerHeight - headerH - scoreH - debugH - margin * 2;
      const availableWidth = window.innerWidth - margin * 2;
      // ゲーム全体が必ず収まるスケールを計算
      const scaleW = availableWidth / GAME_WIDTH;
      const scaleH = availableHeight / GAME_HEIGHT;
      scale = Math.min(scaleW, scaleH, 1);
      // canvas自体は拡張サイズ
      canvas.width = GAME_WIDTH;
      canvas.height = GAME_HEIGHT;
      // CSSで見た目サイズを調整
      canvas.style.width = (GAME_WIDTH * scale) + 'px';
      canvas.style.height = (GAME_HEIGHT * scale) + 'px';
    }

    // 初期サイズ設定とリサイズイベントの監視
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let players = {};
    let puck = { x: BASE_WIDTH / 2, y: BASE_HEIGHT / 2 };
    let myPos = { x: BASE_WIDTH / 2, y: BASE_HEIGHT * 0.925 };
    let score = { top: 0, bottom: 0 };

    // パーティクル（火花）管理
    let particles = [];
    let lastPuck = { x: puck.x, y: puck.y, vx: 0, vy: 0 };
    let lastCollision = false;
    let lastWallCollision = { top: false, bottom: false, left: false, right: false };

    // ---- 定数 ----
    const BASE_GOAL_HEIGHT = 10;
    const BASE_PADDLE_RADIUS = 45;
    const BASE_PUCK_RADIUS = 20;

    // ゴール幅の状態
    let goalWidths = {
        top: 200,    // デフォルト値
        bottom: 200  // デフォルト値
    };

    // スケールに応じて値を計算
    const getScaledValue = (baseValue) => baseValue;  // スケールは ctx.scale() で適用
    const GOAL_HEIGHT = getScaledValue(BASE_GOAL_HEIGHT);

    // ---- チーム選択 ----
    document.getElementById("blue-team").addEventListener("click", () => {
      selectedTeam = "top";
      isSpectator = false;
      document.getElementById("team-select").style.display = "none";
      socket.emit("joinTeam", { team: "top" });
    });

    document.getElementById("red-team").addEventListener("click", () => {
      selectedTeam = "bottom";
      isSpectator = false;
      document.getElementById("team-select").style.display = "none";
      socket.emit("joinTeam", { team: "bottom" });
    });

    // ---- マウス移動送信 ----
    canvas.addEventListener("mousemove", (e) => {
      if (isSpectator) return; // 観戦モード時は操作不可

      const rect = canvas.getBoundingClientRect();
      // CSSサイズ→実サイズに変換
      const x = (e.clientX - rect.left) * (canvas.width / rect.width) - WALL_THICKNESS;
      const y = (e.clientY - rect.top) * (canvas.height / rect.height) - WALL_THICKNESS;
      // パドルの移動範囲（壁＋パドル半径分だけ内側）
      const minX = BASE_PADDLE_RADIUS;
      const maxX = BASE_WIDTH - BASE_PADDLE_RADIUS;
      const minY = BASE_PADDLE_RADIUS;
      const maxY = BASE_HEIGHT - BASE_PADDLE_RADIUS;
      const clampedX = Math.max(minX, Math.min(maxX, x));
      const clampedY = Math.max(minY, Math.min(maxY, y));
      myPos.x = clampedX;
      myPos.y = clampedY;
      myCoordsEl.textContent = `x: ${clampedX.toFixed(1)}, y: ${clampedY.toFixed(1)}`;
      socket.emit("playerMove", { x: clampedX, y: clampedY });
    });

    // ---- タッチ移動送信 ----
    canvas.addEventListener("touchmove", (e) => {
      if (isSpectator) return; // 観戦モード時は操作不可
      
      if (e.touches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        const touch = e.touches[0];
        const x = (touch.clientX - rect.left) * (canvas.width / rect.width) - WALL_THICKNESS;
        const y = (touch.clientY - rect.top) * (canvas.height / rect.height) - WALL_THICKNESS;
        const minX = BASE_PADDLE_RADIUS;
        const maxX = BASE_WIDTH - BASE_PADDLE_RADIUS;
        const minY = BASE_PADDLE_RADIUS;
        const maxY = BASE_HEIGHT - BASE_PADDLE_RADIUS;
        const clampedX = Math.max(minX, Math.min(maxX, x));
        const clampedY = Math.max(minY, Math.min(maxY, y));
        myPos.x = clampedX;
        myPos.y = clampedY;
        myCoordsEl.textContent = `x: ${clampedX.toFixed(1)}, y: ${clampedY.toFixed(1)}`;
        socket.emit("playerMove", { x: clampedX, y: clampedY });
      }
    }, { passive: false });

    // ---- サーバから状態を受信 ----
    // 勝利メッセージの表示
    socket.on("gameWin", (data) => {
      const winnerEl = document.getElementById("winner");
      winnerEl.style.display = "block";
      winnerEl.textContent = data.winner === "top" ? "🔵 青チームの勝利！" : "🔴 赤チームの勝利！";
      // 3秒後にメッセージを非表示
      setTimeout(() => {
        winnerEl.style.display = "none";
      }, 3000);
    });

    socket.on("state", (data) => {
      players = data.players;
      // ゴール幅の更新
      if (data.goalWidth) {
        goalWidths = data.goalWidth;
      }
      // パックとパドルの衝突判定
      let collision = false;
      let wallCollision = { top: false, bottom: false, left: false, right: false };
      if (data.puck && data.players) {
        // パドル衝突
        for (const id in data.players) {
          const p = data.players[id];
          if (!p) continue;
          const dx = data.puck.x - p.x;
          const dy = data.puck.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < BASE_PADDLE_RADIUS + BASE_PUCK_RADIUS) {
            collision = true;
            // 衝突した瞬間のみ火花生成
            if (!lastCollision) {
              const vx = data.puck.x - lastPuck.x;
              const vy = data.puck.y - lastPuck.y;
              spawnParticles(data.puck.x, data.puck.y, vx, vy, 16);
            }
            break;
          }
        }
        // 壁衝突判定（壁厚み分だけ内側）
        if (data.puck.y - BASE_PUCK_RADIUS <= WALL_THICKNESS) wallCollision.top = true;
        if (data.puck.y + BASE_PUCK_RADIUS >= BASE_HEIGHT - WALL_THICKNESS) wallCollision.bottom = true;
        if (data.puck.x - BASE_PUCK_RADIUS <= WALL_THICKNESS) wallCollision.left = true;
        if (data.puck.x + BASE_PUCK_RADIUS >= BASE_WIDTH - WALL_THICKNESS) wallCollision.right = true;
        // 壁衝突した瞬間のみ火花生成
        for (const dir of ["top", "bottom", "left", "right"]) {
          if (wallCollision[dir] && !lastWallCollision[dir]) {
            const vx = data.puck.x - lastPuck.x;
            const vy = data.puck.y - lastPuck.y;
            spawnParticles(data.puck.x, data.puck.y, vx, vy, 12);
          }
        }
      }
      lastCollision = collision;
      lastWallCollision = wallCollision;
      if (data.puck) {
        const vx = data.puck.x - lastPuck.x;
        const vy = data.puck.y - lastPuck.y;
        lastPuck = { x: data.puck.x, y: data.puck.y, vx, vy };
        puck = data.puck;
      }
      if (data.score) {
        if (data.score.top !== score.top || data.score.bottom !== score.bottom) {
          flashScore();
        }
        score = data.score;
        scoreTopEl.textContent = data.score.top;
        scoreBottomEl.textContent = data.score.bottom;
      }
    });

    // 火花パーティクル生成
    function spawnParticles(x, y, vx, vy, count) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 6 + Math.random() * 8;
        const dx = Math.cos(angle) * speed + vx * 0.5;
        const dy = Math.sin(angle) * speed + vy * 0.5;
        const color = `rgba(${220 + Math.random() * 35 | 0},${180 + Math.random() * 60 | 0},${40 + Math.random() * 40 | 0},1)`;
        particles.push({
          x, y,
          dx, dy,
          life: 18 + Math.random() * 10,
          color,
          size: 2 + Math.random() * 2
        });
      }
    }

    // ---- 得点エフェクト ----
    function flashScore() {
      document.body.classList.add("flash");
      setTimeout(() => document.body.classList.remove("flash"), 400);
    }

    // ---- 円描画 ----
    function drawCircle(x, y, r, color) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
    }

    // ---- メイン描画 ----
    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // --- 壁の描画（上下左右・canvas端） ---
      ctx.save();
      ctx.fillStyle = '#888';
      // 上
      ctx.fillRect(0, 0, canvas.width, WALL_THICKNESS);
      // 下
      ctx.fillRect(0, canvas.height - WALL_THICKNESS, canvas.width, WALL_THICKNESS);
      // 左
      ctx.fillRect(0, 0, WALL_THICKNESS, canvas.height);
      // 右
      ctx.fillRect(canvas.width - WALL_THICKNESS, 0, WALL_THICKNESS, canvas.height);
      ctx.restore();

      // 中央ライン
      ctx.strokeStyle = "#333";
      ctx.beginPath();
      ctx.moveTo(WALL_THICKNESS, canvas.height / 2);
      ctx.lineTo(canvas.width - WALL_THICKNESS, canvas.height / 2);
      ctx.stroke();

      // ゴールエリア
      // 上側（赤チーム用）のゴール
      const topGoalOffsetX = (BASE_WIDTH - goalWidths.top) / 2;
      ctx.fillStyle = "rgba(255, 50, 50, 0.15)";
      ctx.fillRect(topGoalOffsetX + WALL_THICKNESS, WALL_THICKNESS, goalWidths.top, GOAL_HEIGHT + 20);

      // 下側（青チーム用）のゴール
      const bottomGoalOffsetX = (BASE_WIDTH - goalWidths.bottom) / 2;
      ctx.fillStyle = "rgba(0, 100, 255, 0.15)";
      ctx.fillRect(bottomGoalOffsetX + WALL_THICKNESS, canvas.height - WALL_THICKNESS - GOAL_HEIGHT - 20, goalWidths.bottom, GOAL_HEIGHT + 20);

      // ゴール枠線
      ctx.lineWidth = 3;
      // 上側（赤チーム用）のゴール枠線
      ctx.strokeStyle = "rgba(255, 80, 80, 0.6)";
      ctx.strokeRect(topGoalOffsetX + WALL_THICKNESS, WALL_THICKNESS, goalWidths.top, GOAL_HEIGHT + 20);
      // 下側（青チーム用）のゴール枠線
      ctx.strokeStyle = "rgba(0, 150, 255, 0.6)";
      ctx.strokeRect(bottomGoalOffsetX + WALL_THICKNESS, canvas.height - WALL_THICKNESS - GOAL_HEIGHT - 20, goalWidths.bottom, GOAL_HEIGHT + 20);

      // チームカラーに基づくマレット描画関数
      function drawTeamPaddle(px, py, r, team) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, r + 10, 0, Math.PI * 2);
        
        if (team === "top") {
          // 青チーム
          ctx.fillStyle = 'rgba(80,200,255,0.08)';
          ctx.fill();
          ctx.shadowColor = 'rgba(80,200,255,0.9)';
          ctx.shadowBlur = 18;
          const grad = ctx.createRadialGradient(px, py, r * 0.2, px, py, r);
          grad.addColorStop(0, 'rgba(160,240,255,1)');
          grad.addColorStop(0.6, 'rgba(80,200,255,1)');
          grad.addColorStop(1, 'rgba(10,80,140,1)');
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fillStyle = grad;
        } else {
          // 赤チーム
          ctx.fillStyle = 'rgba(255,120,120,0.07)';
          ctx.fill();
          ctx.shadowColor = 'rgba(255,90,90,0.95)';
          ctx.shadowBlur = 16;
          const gradR = ctx.createRadialGradient(px, py, r * 0.2, px, py, r);
          gradR.addColorStop(0, 'rgba(255,200,200,1)');
          gradR.addColorStop(0.6, 'rgba(255,120,120,1)');
          gradR.addColorStop(1, 'rgba(80,10,10,1)');
          ctx.beginPath();
          ctx.arc(px, py, r, 0, Math.PI * 2);
          ctx.fillStyle = gradR;
        }
        ctx.fill();
        ctx.restore();
      }

      // 他プレイヤー描画（サーバー座標）
      for (const id in players) {
        const p = players[id];
        if (!p || id === socket.id) continue; // 自分以外を描画
        const px = p.x + WALL_THICKNESS;
        const py = p.y + WALL_THICKNESS;
        const r = BASE_PADDLE_RADIUS;
        drawTeamPaddle(px, py, r, p.team);
      }

      // 自分のマレットはローカル座標で即時描画
      if (!isSpectator) {
        const px = myPos.x + WALL_THICKNESS;
        const py = myPos.y + WALL_THICKNESS;
        const r = BASE_PADDLE_RADIUS;
        drawTeamPaddle(px, py, r, selectedTeam);
      }

      // パック描画
      drawCircle(puck.x + WALL_THICKNESS, puck.y + WALL_THICKNESS, BASE_PUCK_RADIUS, "white");
      puckCoordsEl.textContent = `x: ${puck.x.toFixed(1)}, y: ${puck.y.toFixed(1)}`;

      // 火花パーティクル描画
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        ctx.beginPath();
        ctx.arc(pt.x + WALL_THICKNESS, pt.y + WALL_THICKNESS, pt.size, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.globalAlpha = Math.max(0, pt.life / 24);
        ctx.fill();
        ctx.globalAlpha = 1;
        pt.x += pt.dx;
        pt.y += pt.dy;
        pt.dx *= 0.92;
        pt.dy *= 0.92;
        pt.life--;
        if (pt.life < 0) particles.splice(i, 1);
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>

</html>
